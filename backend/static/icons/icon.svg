<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#041f14" />
      <stop offset="100%" stop-color="#080c0a" />
    </radialGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="1" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Outer Ring with subtle glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ring-grad)" stroke-width="4" stroke-dasharray="8 8" opacity="0.6" />
  
  <!-- Middle Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.4" />

  <!-- Outer Glow Aura -->
  <circle cx="256" cy="256" r="110" fill="url(#core-glow)" filter="url(#glow)" opacity="0.75" />

  <!-- Central Emerald Core -->
  <circle cx="256" cy="256" r="65" fill="#10b981" filter="url(#glow)" />
  <circle cx="256" cy="256" r="35" fill="#a7f3d0" />

  <!-- Geometric accent lines -->
  <path d="M 256 76 L 256 100 M 256 412 L 256 436 M 76 256 L 100 256 M 412 256 L 436 256" stroke="#34d399" stroke-width="3" stroke-linecap="round" opacity="0.8" />
</svg>
